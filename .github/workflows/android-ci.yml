name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: android

      - name: Compile Android Instrumentation Tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

      - name: Upload Debug APK on Success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  firmware-tests:
    name: Firmware C++ Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Run Direction Logic Tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          firmware/direction_logic/test_direction_logic.cpp
          firmware/direction_logic/direction_logic.cpp
          -o /tmp/test_direction_logic &&
          /tmp/test_direction_logic

  repo-standards:
    name: Repository Standards & Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Repository Standards Unit Tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check Repository Standards & Architectural Contracts
        run: python3 scripts/check_repo_standards.py
