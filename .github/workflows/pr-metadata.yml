name: PR Metadata

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  metadata:
    name: Auto-assign Labels, Author & Milestone
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Assign PR author and default milestone
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              return;
            }
            const { owner, repo } = context.repo;

            // 1. Auto-assign PR author when assignees list is empty
            if ((!pr.assignees || pr.assignees.length === 0) && pr.user && pr.user.login && pr.user.type !== 'Bot') {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: pr.number,
                  assignees: [pr.user.login],
                });
                core.info(`Assigned PR #${pr.number} to @${pr.user.login}`);
              } catch (err) {
                core.warning(`Could not auto-assign @${pr.user.login}: ${err.message}`);
              }
            }

            // 2. Auto-attach open milestone "Финал" when milestone is unset
            if (!pr.milestone) {
              try {
                const { data: milestones } = await github.rest.issues.listMilestones({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                });
                const target = milestones.find((m) => m.title === 'Финал');
                if (target) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: pr.number,
                    milestone: target.number,
                  });
                  core.info(`Attached milestone "${target.title}" (#${target.number}) to PR #${pr.number}`);
                } else {
                  core.info('Open milestone "Финал" not found; skipping milestone assignment.');
                }
              } catch (err) {
                core.warning(`Could not attach milestone: ${err.message}`);
              }
            }
